# BA-SEC-DEP-001: accepted Shared source baseline plus manifest-aware negatives.
# Shared PR #429's strict validator is not yet released. This does not claim
# repository alert settings, release approval, live scanners or provider ACLs.
name: Enforce Dependency Maintenance Policy

on:
  push:
    branches: [main]
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/enforce-dependabot-config.yml"
      - ".github/workflows/dependency-security.yml"
      - ".github/workflows/foundation.yml"
      - ".baobab/repository.yaml"
      - ".github/CODEOWNERS"
      - "docs/security/dependency-maintenance.md"
      - "tests/security/test_dependency_maintenance.py"
  pull_request:
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/enforce-dependabot-config.yml"
      - ".github/workflows/dependency-security.yml"
      - ".github/workflows/foundation.yml"
      - ".baobab/repository.yaml"
      - ".github/CODEOWNERS"
      - "docs/security/dependency-maintenance.md"
      - "tests/security/test_dependency_maintenance.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accepted-shared-baseline:
    permissions:
      contents: read
    uses: baobab-platform/shared/.github/workflows/enforce-dependabot-config.yml@31de2bc3dcd56128c019c640dc7e12c10ae9ca69 # accepted Shared v2.3.0
    with:
      required-ecosystems: "github-actions,gomod,terraform,npm,docker,docker-compose"

  local-policy-regressions:
    name: Validate actual manifest topology and negative fixtures
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin offline YAML parser in disposable virtualenv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ba-sec-dep-001"
          "$RUNNER_TEMP/ba-sec-dep-001/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Assert dependency inventory, genuine scanner and protected staging negatives
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ba-sec-dep-001/bin/python" -B -m unittest discover -s tests/security -p 'test_dependency_maintenance.py' -v
