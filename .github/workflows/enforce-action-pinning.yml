# BA-SEC-DEP-001: verify immutable GitHub Action references using accepted
# Shared v2.3.0. This is source validation, not advisory surveillance for
# individual pinned Action releases or proof of live GitHub security settings.
name: Enforce Action Pinning

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read
    uses: baobab-platform/shared/.github/workflows/enforce-action-pinning.yml@31de2bc3dcd56128c019c640dc7e12c10ae9ca69 # accepted Shared v2.3.0
