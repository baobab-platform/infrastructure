name: DEV-01 to DEV-06 development qualification
on:
  pull_request:
    paths:
      - tests/platform-integration/development/**
      - tests/platform-integration/l4.py
      - .github/workflows/platform-development.yml
      - .devcontainer/platform-integration/**
  push:
    branches: [main]
    paths:
      - tests/platform-integration/development/**
      - tests/platform-integration/l4.py
      - .github/workflows/platform-development.yml
      - .devcontainer/platform-integration/**
  workflow_dispatch:
permissions:
  contents: read
  packages: read
# Every Actions job owns a fresh runner and nonce-labelled private resources.
# Serialize duplicate events for one candidate, not unrelated source revisions;
# a stuck superseded devcontainer must not block a corrected development run.
concurrency:
  group: dev01-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  source:
    name: DEV-01 source and recovery contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B tests/platform-integration/l4.py preflight development --static
      - run: python3 -B -m unittest discover -s tests/platform-integration/development -p 'test_*.py' -v
      - name: Checkout exact accepted Shared DEV-14 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: baobab-platform/shared
          ref: 9fa1bbd6ad9b5c9d4ec406c721bd75227803dcea
          path: .shared-dev14
          persist-credentials: false
      - name: Set up deterministic DEV-14 source-validation Python
        uses: actions/setup-python@ad3497abcd142e169a10aac37abd5175c44f33c4 # v7.0.0+6
        with:
          python-version: "3.13"
      - name: Install pinned Shared validator dependencies
        run: python3 -m pip install --disable-pip-version-check -r .shared-dev14/.github/foundation-tests/requirements.txt
      - name: Plan both DEV-14 profiles without inventing native readiness
        run: |
          for profile in pulse-intelligence payments-sandbox; do
            python3 -B tests/platform-integration/development/engine_onboarding.py plan \
              --profile "$profile" --shared-root .shared-dev14 > "$RUNNER_TEMP/dev14-$profile.json"
            python3 - "$RUNNER_TEMP/dev14-$profile.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x["result"]=="BLOCKED"
          assert x["eng_onb_runtime_cases"]=="NOT_EXECUTED"
          assert x["protected_acceptance"] is False
          assert x["production_authorized"] is False
          assert {"iam","control-plane","subject"} <= set(x["required_service_order"])
          PY
          done
  runtime:
    name: DEV-01 real IAM CP bootstrap and recoverable teardown
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install existing pinned Dev Containers CLI
        run: npm ci --prefix tests/platform-integration/devcontainer-cli --ignore-scripts --no-audit --no-fund
      - name: Start the same private integration container used by Codespaces
        run: |
          tests/platform-integration/devcontainer-cli/node_modules/.bin/devcontainer up --frozen-lockfile \
            --workspace-folder . --config .devcontainer/platform-integration/devcontainer.json
      - name: Observe actual lifecycle, failure, recovery and cleanup
        run: |
          tests/platform-integration/devcontainer-cli/node_modules/.bin/devcontainer exec \
            --workspace-folder . --config .devcontainer/platform-integration/devcontainer.json \
            --remote-env BAOBAB_ENVIRONMENT=development \
            python3 -B tests/platform-integration/development/ci.py
      - name: Observe original seven INT-03C cases in a fresh isolated run
        run: |
          tests/platform-integration/devcontainer-cli/node_modules/.bin/devcontainer exec \
            --workspace-folder . --config .devcontainer/platform-integration/devcontainer.json \
            --remote-env BAOBAB_ENVIRONMENT=development \
            python3 -B tests/platform-integration/development/ci_int03c.py
      - name: Qualify all fourteen NAB-03 cases with current CMS authority
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DEV05_NPM_TOKEN: ${{ github.token }}
          DEV05_REGISTRY_USERNAME: ${{ github.actor }}
        run: |
          tests/platform-integration/devcontainer-cli/node_modules/.bin/devcontainer exec \
            --workspace-folder . --config .devcontainer/platform-integration/devcontainer.json \
            --remote-env BAOBAB_ENVIRONMENT=development \
            --remote-env "DEV05_NPM_TOKEN=$DEV05_NPM_TOKEN" \
            --remote-env "DEV05_REGISTRY_USERNAME=$DEV05_REGISTRY_USERNAME" \
            python3 -B tests/platform-integration/development/ci_cms.py
      - name: Recover through the shared development CLI
        if: always()
        run: |
          tests/platform-integration/devcontainer-cli/node_modules/.bin/devcontainer exec \
            --workspace-folder . --config .devcontainer/platform-integration/devcontainer.json \
            python3 -B tests/platform-integration/l4.py recover development --all
      - name: Host-side recovery if the development container was lost
        if: always()
        run: python3 -B tests/platform-integration/l4.py recover development --all
      - name: Retain only sanitized completed receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev01-lifecycle-evidence
          path: |
            tests/platform-integration/evidence/dev01-*/completed/*.json
            tests/platform-integration/evidence/dev01-lifecycle-suite.json
            tests/platform-integration/evidence/dev02-fixture-suite.json
            tests/platform-integration/evidence/dev03-authority-suite.json
            tests/platform-integration/evidence/dev04-int03c-suite*.json
            tests/platform-integration/evidence/dev05-cms-suite*.json
          if-no-files-found: warn
          retention-days: 14

  external-api:
    name: DEV-06 external API-only IAM CP Pulse and zero estates
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned integration CLI
        run: npm ci --prefix tests/platform-integration/devcontainer-cli --ignore-scripts --no-audit --no-fund
      - name: Start the Codespaces integration container
        run: tests/platform-integration/devcontainer-cli/node_modules/.bin/devcontainer up --frozen-lockfile --workspace-folder . --config .devcontainer/platform-integration/devcontainer.json
      - name: Observe real external-client component journey and canonical blockers
        run: |
          tests/platform-integration/devcontainer-cli/node_modules/.bin/devcontainer exec \
            --workspace-folder . --config .devcontainer/platform-integration/devcontainer.json \
            --remote-env BAOBAB_ENVIRONMENT=development \
            python3 -B tests/platform-integration/l4.py run-external development
      - name: Container recovery
        if: always()
        run: tests/platform-integration/devcontainer-cli/node_modules/.bin/devcontainer exec --workspace-folder . --config .devcontainer/platform-integration/devcontainer.json python3 -B tests/platform-integration/l4.py recover development --all
      - name: Independent host recovery
        if: always()
        run: python3 -B tests/platform-integration/l4.py recover development --all
      - name: Retain sanitized completed external receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dev06-external-api-evidence
          path: |
            tests/platform-integration/evidence/dev01-*/completed/*.json
            tests/platform-integration/evidence/dev06-external-suite*.json
          if-no-files-found: warn
          retention-days: 14

  buyer-identity:
    name: DEV-07 live IAM CP and native buyer-handler qualification
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned integration CLI
        run: npm ci --prefix tests/platform-integration/devcontainer-cli --ignore-scripts --no-audit --no-fund
      - name: Start the common integration laboratory
        run: tests/platform-integration/devcontainer-cli/node_modules/.bin/devcontainer up --frozen-lockfile --workspace-folder . --config .devcontainer/platform-integration/devcontainer.json
      - name: Run actual DEV-07 issuer CP and native-handler observations
        run: |
          tests/platform-integration/devcontainer-cli/node_modules/.bin/devcontainer exec \
            --workspace-folder . --config .devcontainer/platform-integration/devcontainer.json \
            --remote-env BAOBAB_ENVIRONMENT=development \
            python3 -B tests/platform-integration/development/buyer_identity.py
      - name: Recover all owned resources
        if: always()
        run: |
          tests/platform-integration/devcontainer-cli/node_modules/.bin/devcontainer exec \
            --workspace-folder . --config .devcontainer/platform-integration/devcontainer.json \
            python3 -B tests/platform-integration/l4.py recover development --all
      - name: Independent host recovery
        if: always()
        run: python3 -B tests/platform-integration/l4.py recover development --all
      - name: Retain only completed sanitized evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev07-buyer-identity-evidence
          path: |
            tests/platform-integration/evidence/dev07-buyer-suite*.json
            tests/platform-integration/evidence/dev01-*/completed/*.json
          if-no-files-found: warn
          retention-days: 14
