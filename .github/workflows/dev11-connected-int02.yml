name: DEV-11 connected Keycloak / CP W3C candidate qualification

# Real disposable IAM issuer, CP process, PostgreSQL and Pulse containers.
# Pin the unmerged CP candidate explicitly and refuse to infer production proof.
# The outbox/consumer path is NOT part of this profile.
on:
  pull_request:
    paths:
      - .github/workflows/dev11-connected-int02.yml
      - .github/workflows/platform-int02.yml
      - tests/platform-integration/int02/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev11-native-iam-cp:
    name: Real issuer -> CP W3C and denied-authority observations
    uses: ./.github/workflows/platform-int02.yml
    with:
      harness_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      candidate_repository: baobab-cp
      # CP #458 is merged; pin exact accepted CP main with W3C code and preserve all original INT-02 cases.
      candidate_sha: 6fee9fe9537409df428a2e3dd7b8f78ff8d1d456
      dev11_connected_required: true
