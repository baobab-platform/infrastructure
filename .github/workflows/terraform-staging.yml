name: Terraform Staging

on:
  pull_request:
    paths:
      - "terraform/environments/staging/**"
      - ".github/workflows/terraform-staging.yml"
      - "deploy/runtime-helper/**"
      - "deploy/verification/**"
      - "tests/staging/**"
  push:
    branches: [main]
    paths:
      - "terraform/environments/staging/**"
      - ".github/workflows/terraform-staging.yml"
      - "deploy/runtime-helper/**"
      - "deploy/verification/**"
      - "tests/staging/**"

permissions:
  contents: read

concurrency:
  group: terraform-staging-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: terraform/environments/staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Terraform format
        run: terraform fmt -check -recursive
      - name: Terraform init without remote backend
        run: terraform init -backend=false -lockfile=readonly
      - name: Terraform validate
        run: terraform validate


      - name: Terraform mocked release plans (no AWS credentials)
        run: terraform test
      - name: Offline release validation
        run: python ../../../deploy/verification/staging.py validate --release tests/release.fixture.json

  runtime-helper:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: deploy/runtime-helper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: deploy/runtime-helper/go.mod
          cache-dependency-path: deploy/runtime-helper/go.sum
      - name: Tests and static analysis
        run: |
          test -z "$(gofmt -l .)"
          go test -race ./...
          go vet ./...
      - name: Read-only preflight and observation tests
        working-directory: .
        run: python -m unittest discover -s tests/staging -v
      - name: Build helper image
        run: docker build --build-arg REVISION="$GITHUB_SHA" -t baobab-runtime-helper:test .
      - name: Scan helper image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: baobab-runtime-helper:test
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
