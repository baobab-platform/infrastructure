name: Subscriptions native development onboarding
on:
  pull_request:
    paths:
      - tests/platform-integration/development/**
      - .github/workflows/subscriptions-onboarding.yml
  push:
    branches: [main]
    paths:
      - tests/platform-integration/development/**
      - .github/workflows/subscriptions-onboarding.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tests/platform-integration/development -p 'test_*.py' -v
  native:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install existing pinned integration CLI
        run: npm ci --prefix tests/platform-integration/devcontainer-cli --ignore-scripts --no-audit --no-fund
      - name: Start the same private laboratory used in Codespaces
        run: tests/platform-integration/devcontainer-cli/node_modules/.bin/devcontainer up --frozen-lockfile --workspace-folder . --config .devcontainer/platform-integration/devcontainer.json
      - name: Observe authentic issuer and current CP through Subscriptions PG17 persistence
        run: |
          tests/platform-integration/devcontainer-cli/node_modules/.bin/devcontainer exec \
            --workspace-folder . --config .devcontainer/platform-integration/devcontainer.json \
            --remote-env BAOBAB_ENVIRONMENT=development \
            python3 -B tests/platform-integration/development/ci_subscriptions.py
      - name: Recover inside the laboratory
        if: always()
        run: tests/platform-integration/devcontainer-cli/node_modules/.bin/devcontainer exec --workspace-folder . --config .devcontainer/platform-integration/devcontainer.json python3 -B tests/platform-integration/l4.py recover development --all
      - name: Independent host recovery
        if: always()
        run: python3 -B tests/platform-integration/l4.py recover development --all
      - name: Retain only completed sanitized observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: subscriptions-native-onboarding
          path: |
            tests/platform-integration/evidence/subscriptions-onboarding*.json
            tests/platform-integration/evidence/dev01-*/completed/*.json
          if-no-files-found: warn
          retention-days: 14
