name: Verify Coordinated Staging Selection
on:
  workflow_dispatch:
    inputs:
      coordination_path:
        description: Reviewed deploy/releases/staging/*.coordination.json on main
        required: true
        default: deploy/releases/staging/v0.1.0-staging.coordination.json
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify five immutable publishers without AWS credentials
        env:
          COORDINATION_PATH: ${{ inputs.coordination_path }}
          GH_TOKEN: ${{ secrets.STAGING_RELEASE_READ_TOKEN || github.token }}
        run: |
          python - <<'CHECK'
          import os,re,pathlib
          path=os.environ['COORDINATION_PATH']
          if not re.fullmatch(r'deploy/releases/staging/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-staging\.coordination\.json',path):
              raise SystemExit('Invalid reviewed coordination path')
          if not pathlib.Path(path).is_file(): raise SystemExit('Reviewed selection is absent')
          CHECK
          python deploy/verification/release_cut.py --coordination "$COORDINATION_PATH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: staging-selection-verification
          path: staging-cut-verification.json
          if-no-files-found: error
          retention-days: 30
