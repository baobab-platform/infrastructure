name: INT-03 identity smoke and CMS component preparation
# Identity smoke plus actual CMS/PG component preparation; connected NAB-03 and full INT-03 remain separate.
# cms-gate records NAB-03 BLOCKED at the registry gate; it is not CMS acceptance.
on:
  pull_request:
    paths:
      - tests/platform-integration/int03/**
      - tests/platform-integration/int02/**
      - tests/platform-integration/devcontainer-cli/**
      - tests/platform-integration/l4.py
      - tests/platform-integration/manifest.lock.json
      - tests/platform-integration/schema/**
      - .github/workflows/platform-int03.yml
      - .devcontainer/platform-integration/**
  push:
    branches: [main]
    paths:
      - tests/platform-integration/int03/**
      - tests/platform-integration/int02/**
      - tests/platform-integration/devcontainer-cli/**
      - tests/platform-integration/l4.py
      - tests/platform-integration/manifest.lock.json
      - tests/platform-integration/schema/**
      - .github/workflows/platform-int03.yml
      - .devcontainer/platform-integration/**
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: int03-identity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: INT-03 source/security contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 tests/platform-integration/int03/run.py preflight
      - run: python3 -B -m unittest discover -s tests/platform-integration/int03 -p 'test_*.py' -v
      - run: python3 -B tests/platform-integration/int03/cms_provider.py preflight
      - run: node --check tests/platform-integration/int03/cms_probe.mjs
      - run: node --check tests/platform-integration/int03/consumer.mjs
      - run: bash -n tests/platform-integration/int03/fixture.sh
      - run: bash -n tests/platform/run-l3.sh
  cms-gate:
    name: INT-03 CMS registry gate (NAB-03 BLOCKED while the activation hold stands)
    # Accepted Shared #354: the CMS lane needs two named development identities
    # in the canonical registry; the owner's no-registry-activation hold keeps
    # them out. This reads the unmodified registry at the locked Shared commit
    # and records every NAB-03 case BLOCKED. It never provisions an identity,
    # contacts a service or reports qualification. HELD passes; REFUSED (a
    # registry defect) and OPEN (the connected CMS lane is now owed) fail.
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the locked Shared commit
        id: pin
        run: |
          echo "shared=$(python3 -c 'import json;print(json.load(open("tests/platform-integration/int03/cms-lock.json"))["sources"]["shared"])')" >> "$GITHUB_OUTPUT"
          echo "iam=$(python3 -c 'import json;print(json.load(open("tests/platform-integration/int03/cms-lock.json"))["sources"]["baobab-iam"])')" >> "$GITHUB_OUTPUT"
      - name: Check out Shared at the locked commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: baobab-platform/shared
          ref: ${{ steps.pin.outputs.shared }}
          path: .int03-cms/shared
          persist-credentials: false
      - name: Check out exact CMS IAM native source pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: baobab-platform/baobab-iam
          ref: ${{ steps.pin.outputs.iam }}
          path: .int03-cms/iam
          persist-credentials: false
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Independently check native IAM activation and recovery gate
        run: python3 -B tests/platform-integration/int03/cms_iam_native.py preflight --shared .int03-cms/shared --iam .int03-cms/iam
      - name: Registry gate and NAB-03 receipt
        run: python3 -B tests/platform-integration/int03/cms_gate.py --shared .int03-cms/shared --out "$RUNNER_TEMP/int03-cms-gate"
      - name: Retain the gate receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: int03-cms-gate-receipt
          if-no-files-found: warn
          path: ${{ runner.temp }}/int03-cms-gate
  cms-component:
    name: Real source-built CMS and PostgreSQL 17 component preparation
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Build, migrate, provision and probe the actual disposable provider
        run: python3 -B tests/platform-integration/int03/cms_provider.py run
      - name: Always recover owned CMS resources
        if: always()
        run: python3 -B tests/platform-integration/int03/cms_provider.py down
      - name: Independently witness CMS-only Docker teardown and seal runtime evidence
        # Read-only second process, after cleanup: not an IAM/CP/NAB-03 pass.
        if: always()
        run: python3 -B tests/platform-integration/int03/cms_component_custody.py capture
      - name: Independently re-hash sealed runtime evidence
        if: always()
        run: python3 -B tests/platform-integration/int03/cms_component_custody.py verify
      - name: Retain only atomic sanitized component receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: int03-cms-component-preparation
          if-no-files-found: warn
          path: |
            tests/platform-integration/evidence/cms-component-*/completed/receipt.json
            tests/platform-integration/evidence/cms-component-*/completed/receipt.sha256
            tests/platform-integration/evidence/cms-component-*/custody/component.json
            tests/platform-integration/evidence/cms-component-*/custody/teardown.json
            tests/platform-integration/evidence/cms-component-*/custody/manifest.json
            tests/platform-integration/evidence/cms-component-*/custody/manifest.sha256.json
          retention-days: 14
          overwrite: false
  connected:
    name: Real Nabhold BFF, IAM, CP and TLS Redis smoke
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked Dev Containers CLI
        run: npm ci --prefix tests/platform-integration/devcontainer-cli --ignore-scripts --no-audit --no-fund
      - name: Start the same integration devcontainer used in Codespaces
        run: |
          tests/platform-integration/devcontainer-cli/node_modules/.bin/devcontainer up --frozen-lockfile \
            --workspace-folder . --config .devcontainer/platform-integration/devcontainer.json
      - name: Run connected profile with private stdin package authentication
        env:
          PACKAGE_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          printf '%s\n' "$PACKAGE_READ_TOKEN" | \
            tests/platform-integration/devcontainer-cli/node_modules/.bin/devcontainer exec \
              --workspace-folder . --config .devcontainer/platform-integration/devcontainer.json \
              --remote-env "INT03_REGISTRY_USERNAME=$GITHUB_ACTOR" \
              --remote-env GITHUB_ACTIONS=true \
              --remote-env "GITHUB_RUN_ID=$GITHUB_RUN_ID" \
              python3 -B tests/platform-integration/int03/run.py run --package-token-stdin
      - name: Retry cleanup if a process was interrupted
        if: always()
        run: |
          tests/platform-integration/devcontainer-cli/node_modules/.bin/devcontainer exec \
            --workspace-folder . --config .devcontainer/platform-integration/devcontainer.json \
            python3 -B tests/platform-integration/int03/run.py down
      - name: Host recovery if the devcontainer is unavailable
        if: always()
        run: sudo --preserve-env=GITHUB_ACTIONS python3 -B tests/platform-integration/int03/host_cleanup.py
      - name: Retain only sanitized identity and prerequisite receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: int03-identity-synthetic-observations
          if-no-files-found: warn
          path: |
            tests/platform-integration/evidence/*-int03-identity/completed/receipt.json
            tests/platform-integration/evidence/*-int03-identity/completed/receipt.sha256
            tests/platform-integration/evidence/*-int02.json
            tests/platform-integration/evidence/*-provider-proof.json
            tests/platform-integration/evidence/*-image-manifest.json
