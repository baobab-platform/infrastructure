name: Reviewed Staging Release
on:
  push:
    tags: ['v*.*.*-staging']
  workflow_dispatch:
    inputs:
      release_path:
        description: Reviewed deploy/releases/staging/*.tfvars.json on main
        required: true
        type: string
      apply:
        description: Apply saved plan after protected staging approval
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-26.04
    outputs:
      release_path: ${{ steps.release.outputs.release_path }}
      apply: ${{ steps.release.outputs.apply }}
    steps:
      - name: Select exact tagged manifest or manual main release
        id: release
        env:
          MANUAL_PATH: ${{ inputs.release_path }}
          MANUAL_APPLY: ${{ inputs.apply }}
        run: |
          python - <<'CHECK'
          import os,re
          event=os.environ['GITHUB_EVENT_NAME']; ref=os.environ['GITHUB_REF']; tag=os.environ['GITHUB_REF_NAME']
          if event=='push':
              if not ref.startswith('refs/tags/') or not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-staging',tag): raise SystemExit('Invalid staging release tag')
              path='deploy/releases/staging/'+tag+'.tfvars.json'; apply='true'
          elif event=='workflow_dispatch' and ref=='refs/heads/main':
              path=os.environ['MANUAL_PATH']; apply=os.environ['MANUAL_APPLY']
          else: raise SystemExit('Deployment requires staging tag or manual main')
          if not re.fullmatch(r'deploy/releases/staging/[A-Za-z0-9_.-]+\.tfvars\.json',path): raise SystemExit('Invalid release path')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('release_path='+path+'\napply='+apply+'\n')
          CHECK
  deploy:
    needs: select
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/staging-deploy.yml
    with:
      release_path: ${{ needs.select.outputs.release_path }}
      apply: ${{ fromJSON(needs.select.outputs.apply) }}
    secrets:
      STAGING_RELEASE_READ_TOKEN: ${{ secrets.STAGING_RELEASE_READ_TOKEN }}
