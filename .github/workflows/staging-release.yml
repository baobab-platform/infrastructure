name: Reviewed Staging Release
on:
  workflow_dispatch:
    inputs:
      release_path:
        description: Reviewed deploy/releases/staging/*.tfvars.json on main
        required: true
        type: string
      apply:
        description: Apply the saved plan after the protected staging environment gate
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: baobab-staging-release
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    environment: staging-plan
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_PATH: ${{ inputs.release_path }}
      STAGING_ACCOUNT_ID: ${{ vars.STAGING_ACCOUNT_ID }}
      STAGING_ROLE_ARN: ${{ vars.STAGING_PLAN_ROLE_ARN }}
      STAGING_STATE_BUCKET: ${{ vars.STAGING_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check reviewed release path and required account configuration
        run: |
          python - <<'PY'
          import os, pathlib, re
          value = os.environ['RELEASE_PATH']
          if not re.fullmatch(r'deploy/releases/staging/[A-Za-z0-9_.-]+\.tfvars\.json', value):
              raise SystemExit('Release must be a reviewed staging manifest on main')
          if not pathlib.Path(value).is_file():
              raise SystemExit('Reviewed release is absent')
          for key in ('STAGING_ACCOUNT_ID', 'STAGING_ROLE_ARN', 'STAGING_STATE_BUCKET'):
              if not os.environ.get(key):
                  raise SystemExit('Staging account configuration is incomplete')
          PY
          python deploy/verification/staging.py validate --release "$RELEASE_PATH"
      - name: Assume the staging plan role with the job OIDC identity
        run: python deploy/verification/oidc_credentials.py
      - name: Read-only artifact, certificate and secret-version preflight
        run: python deploy/verification/staging.py preflight --release "$RELEASE_PATH"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Initialize encrypted and locked staging state
        working-directory: terraform/environments/staging
        run: terraform init -lockfile=readonly -backend-config="bucket=$STAGING_STATE_BUCKET" -backend-config="key=baobab/staging/foundation.tfstate" -backend-config="region=af-south-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Save reviewed plan
        working-directory: terraform/environments/staging
        run: |
          terraform plan -input=false -lock-timeout=5m -var-file="../../../$RELEASE_PATH" -out=staging.tfplan
          sha256sum staging.tfplan > staging.tfplan.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-staging-plan
          path: |
            terraform/environments/staging/staging.tfplan
            terraform/environments/staging/staging.tfplan.sha256
          retention-days: 3
          if-no-files-found: error
  apply:
    if: inputs.apply && github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      STAGING_ACCOUNT_ID: ${{ vars.STAGING_ACCOUNT_ID }}
      STAGING_ROLE_ARN: ${{ vars.STAGING_APPLY_ROLE_ARN }}
      STAGING_STATE_BUCKET: ${{ vars.STAGING_STATE_BUCKET }}
      RELEASE_PATH: ${{ inputs.release_path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Assume the staging apply role with the job OIDC identity
        run: python deploy/verification/oidc_credentials.py
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          name: reviewed-staging-plan
          path: terraform/environments/staging
      - name: Initialize the same staging backend
        working-directory: terraform/environments/staging
        run: terraform init -lockfile=readonly -backend-config="bucket=$STAGING_STATE_BUCKET" -backend-config="key=baobab/staging/foundation.tfstate" -backend-config="region=af-south-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Apply the saved plan without replanning
        working-directory: terraform/environments/staging
        run: |
          sha256sum -c staging.tfplan.sha256
          terraform apply -input=false -lock-timeout=5m staging.tfplan
      - name: Capture healthy runtime observations when activated
        run: |
          python - <<'PY'
          import json, os, subprocess
          release = json.load(open(os.environ['RELEASE_PATH']))
          if release.get('activate_workloads') is True:
              subprocess.run(['aws', '--region', 'af-south-1', 'ecs', 'wait', 'services-stable', '--cluster', 'baobab-staging-ecs', '--services', 'baobab-staging-cp', 'baobab-staging-iam', 'baobab-staging-keycloak', 'baobab-staging-apisix'], check=True)
              subprocess.run(['python', 'deploy/verification/staging.py', 'observe', '--release', os.environ['RELEASE_PATH'], '--cluster', 'baobab-staging-ecs', '--infrastructure-revision', os.environ['GITHUB_SHA'], '--output', 'staging-observation.json'], check=True)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: staging-runtime-observation
          path: staging-observation.json
          if-no-files-found: ignore
          retention-days: 30
