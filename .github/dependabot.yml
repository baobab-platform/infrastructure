# BA-SEC-DEP-001: 7 November 2026 infrastructure manifest inventory.
# Matches real Go 1.27, Terraform AWS provider, two npm harness locks,
# three Dockerfile owners and four Compose topologies. Do not add Terraform
# root until a real provider is declared; staging has the provider lock.
# Routine bot scheduling never delays critical security advisory triage.
# The INT-02/03 Compose files reference run-scoped image variables: their
# runtime image/digest supplier inventory must also be independently verified.
# Keep default branch implicit; protected staging applies remain gated.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions-routine:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:10"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 5
    labels: ["dependencies", "go"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      go-routine:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "terraform"
    directory: "/terraform/environments/staging"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:20"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 3
    labels: ["dependencies", "terraform"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
