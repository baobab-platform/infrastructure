schema:
  name: "baobab-platform-development-environment-contract"
  version: "1.0"
application:
  name: "infrastructure"
  version: "0.1.0"
environment:
  provider: "baobab-dev"
  profile: "infra"
  minimum_version: "1.4.3"
  contract_minimum_version: "1.0"
compatibility_policy:
  strict_runtime_versions: true
  allow_newer_patch_versions: true
  allow_newer_minor_versions: false
  allow_older_versions: false
validation:
  required_capabilities:
    - "development.docker"
    - "development.github_cli"
    - "development.terraform"
    - "development.aws_cli"
notes:
  - "Codespaces uses ghcr.io/baobab-platform/baobab-dev:1.4.3-infra."
  - >
    Profile changed from "full" to "infra" (2026-09-03) -- this repo never
    used full's Python/Node/Flutter/Java/Maven/PostgreSQL client; infra is
    the lean Terraform + AWS CLI profile baobab-dev now provides
    specifically for it. See baobab-platform/shared's
    contracts/development-environment/schema.yaml for the profile's
    capability_domains.
  - >
    minimum_version assumes baobab-dev's infra-profile work ships as
    exactly "1.4.0-rc.0" -- confirm the actual tag once cut and update
    both this value and devcontainer.json's image tag together if it
    differs.
