schema:
  name: "baobab-platform-development-environment-contract"
  version: "1.0"
application:
  name: "infrastructure"
  version: "0.1.0"
environment:
  provider: "baobab-dev"
  profile: "full"
  minimum_version: "1.4.4"
  contract_minimum_version: "1.0"
compatibility_policy:
  strict_runtime_versions: true
  allow_newer_patch_versions: true
  allow_newer_minor_versions: false
  allow_older_versions: false
validation:
  required_capabilities:
    - "development.docker"
    - "development.github_cli"
    - "development.terraform"
    - "development.aws_cli"
notes:
  - "Codespaces uses ghcr.io/baobab-platform/baobab-dev:1.4.4; Docker, Terraform, AWS CLI and Go 1.27.3 are layered using Dev Container features."
  - "The full base image is used for reliable Codespaces startup; infrastructure-specific tools are supplied by Dev Container features."
  - "Run make local-env and make local-up manually after the editor opens; no local stack is started automatically."
