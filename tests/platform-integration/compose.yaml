# INT-01: real dependency processes, not IAM/CP or protected staging.
# Every service is private to the uniquely named Compose project. No host ports.
name: ${L4_PROJECT:?L4_PROJECT must be generated by the orchestrator}
services:
  postgres:
    image: ${L4_POSTGRES_IMAGE:?locked image required}
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: l4_test
      POSTGRES_DB: l4_test
      POSTGRES_PASSWORD: ${L4_POSTGRES_PASSWORD:?required}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes: ["pg:/var/lib/postgresql/data"]
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U l4_test -d l4_test"]
      interval: 5s
      retries: 16
      timeout: 3s
      start_period: 10s
  rabbitmq:
    image: ${L4_RABBITMQ_IMAGE:?locked image required}
    hostname: rabbitmq
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    environment:
      RABBITMQ_DEFAULT_USER: l4_test
      RABBITMQ_DEFAULT_PASS: ${L4_RABBITMQ_PASSWORD:?required}
      RABBITMQ_DEFAULT_VHOST: l4_test
    volumes: ["mq:/var/lib/rabbitmq"]
    networks: [foundation]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 12s
  redis:
    image: ${L4_REDIS_IMAGE:?locked image required}
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    environment:
      L4_REDIS_PASSWORD: ${L4_REDIS_PASSWORD:?required}
    command: ["/bin/sh", "-ec", "exec redis-server --save '' --appendonly no --requirepass \"$$L4_REDIS_PASSWORD\""]
    networks: [foundation]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$L4_REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 16
      start_period: 5s
networks:
  foundation:
    internal: true
volumes:
  pg: {}
  mq: {}
