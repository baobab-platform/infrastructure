# INT-03 identity TLS edge (retains INT-02 prerequisite routing) (EA v2.2: the real IAM/CP test runs "over verified local
# TLS"). Every hop that crosses the Compose network reaches Keycloak and CP
# here, under a certificate from this run's throwaway CA. The network is
# internal and publishes no ports.
pid /tmp/nginx.pid;
events {}
http {
    # The longest fixed route labels exceed Nginx's default 64-byte map hash
    # bucket. Without this, Nginx fails its config and the private IAM/CP DNS
    # aliases disappear because the TLS edge container never starts.
    # 128 is verified against the full label set with nginx -t.
    map_hash_bucket_size 128;
    # Never log raw URI/query/header/cookie/body values, including on errors.
    error_log /dev/null;
    map "$server_name:$uri" $int03_route {
        default OTHER;
        "nabhold.int03.test:/sign-in" NAB_SIGN_IN;
        "nabhold.int03.test:/account" NAB_ACCOUNT;
        "nabhold.int03.test:/api/auth/login" NAB_LOGIN;
        "nabhold.int03.test:/api/auth/callback" NAB_CALLBACK;
        "nabhold.int03.test:/api/auth/session" NAB_SESSION;
        "nabhold.int03.test:/api/auth/logout" NAB_LOGOUT;
        "iam.int02.test:/realms/baobab/.well-known/openid-configuration" IAM_DISCOVERY;
        "iam.int02.test:/realms/baobab/protocol/openid-connect/auth" IAM_AUTH;
        "iam.int02.test:/realms/baobab/login-actions/authenticate" IAM_LOGIN_ACTION;
        "iam.int02.test:/realms/baobab/protocol/openid-connect/token" IAM_TOKEN;
        "iam.int02.test:/realms/baobab/protocol/openid-connect/token/introspect" IAM_INTROSPECT;
        "iam.int02.test:/realms/baobab/protocol/openid-connect/certs" IAM_JWKS;
        "cp.int02.test:/v1/admin/effective-authority" CP_SELF;
    }
    map $request_method $int03_method { default OTHER; GET GET; POST POST; }
    map $int03_route $int03_logged { default 1; OTHER 0; }
    log_format int03_safe 'INT03_HTTP $int03_route $int03_method $status';
    access_log /dev/stdout int03_safe if=$int03_logged;
    ssl_certificate     /etc/nginx/tls/edge.pem;
    ssl_certificate_key /etc/nginx/tls/edge.key;
    ssl_protocols TLSv1.3;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    # The root filesystem is read-only; nginx creates every temp path at start.
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    # Resolve upstreams per request: CP starts after the edge.
    resolver 127.0.0.11 valid=2s ipv6=off;
    server {
        listen 443 ssl default_server;
        server_name _;
        return 421;
    }
    server {
        listen 443 ssl;
        server_name iam.int02.test;
        # Keycloak's issuer is fixed by its --hostname; these headers only
        # describe the TLS hop the client actually used.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        location / { set $u http://keycloak:8080; proxy_pass $u; }
    }
    server {
        listen 443 ssl;
        server_name cp.int02.test;
        proxy_set_header Host $host;
        location / { set $u http://cp:8080; proxy_pass $u; }
    }
    # Actual RP callback, on the same verified per-run TLS edge. Never expose
    # a host port or log authorization codes in access logs.
    server {
        listen 443 ssl;
        server_name human.int02.test;
        location / { set $u http://human:8080; proxy_pass $u; }
    }
    server {
        listen 443 ssl;
        server_name pulse.int02.test;
        location / { set $u http://pulse:8000; proxy_pass $u; }
    }

    server {
        listen 443 ssl;
        server_name nabhold.int03.test;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        location / { set $u http://nabhold:3000; proxy_pass $u; }
    }
}
