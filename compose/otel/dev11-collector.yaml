# DEV-11 disposable OpenTelemetry Collector -> Jaeger v2 (NOT staging/production).
# This file is used only when OTEL_COLLECTOR_CONFIG selects it and the
# explicit 'dev11' Compose profile starts the private Jaeger backend.
# Business telemetry never includes identity, headers, event body, SQL or PII.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 1s
    send_batch_size: 256
exporters:
  otlphttp/jaeger:
    endpoint: http://jaeger:4318
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 1m
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/jaeger]
